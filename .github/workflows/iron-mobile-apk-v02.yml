name: Build IRON Mobile APK v0.2

on:
  push:
    branches:
      - iron-mobile-build-v01

jobs:
  build-mobile-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode mobile source v02
        run: |
          rm -rf mobile-build/src-v02
          mkdir -p mobile-build/src-v02
          base64 -d mobile-build/iron-mobile-src-v02.b64 > mobile-build/iron-mobile-src-v02.zip
          unzip -q mobile-build/iron-mobile-src-v02.zip -d mobile-build/src-v02

      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: mobile-build/src-v02
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK=mobile-build/src-v02/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" IRON-MESA-Mobile-v0.2.apk
          sha256sum IRON-MESA-Mobile-v0.2.apk | tee IRON-MESA-Mobile-v0.2.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRON-MESA-Mobile-v0.2
          path: |
            IRON-MESA-Mobile-v0.2.apk
            IRON-MESA-Mobile-v0.2.sha256.txt
          if-no-files-found: error
          retention-days: 7
